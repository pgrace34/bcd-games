name: Publish AltStore source

on:
  push:
    # BCD Duo fork (modified 2026-11-06): the fork's branch too; its builds also dispatch this workflow.
    branches: [main, iphone-duo]
    paths:
      - .github/workflows/altsource.yml
      - tools/update-altsource.py
      - tests/host/check-altsource.py
  pull_request:
    paths:
      - .github/workflows/altsource.yml
      - tools/update-altsource.py
      - tests/host/check-altsource.py
  schedule:
    - cron: '17 * * * *'
  # No release trigger (2026-10-22): those runs ran on the tag's ref, which the github-pages environment does not
  # allow, so each release mailed three failures. The hourly schedule and a dispatch on main after a release publish it.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: altsource-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ (github.event_name == 'pull_request' || github.repository != 'thebcd69/bcd-games') && github.ref || 'main' }}
          persist-credentials: false
          sparse-checkout: |
            tools
            tests/host
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check source generator
        run: python3 tests/host/check-altsource.py

  build:
    needs: check
    # BCD Duo fork (modified 2026-11-06): and pgrace34/bcd-games, whose source lists its own releases (BCD_SOURCE_REPO).
    if: (github.repository == 'thebcd69/bcd-games' || github.repository == 'pgrace34/bcd-games') && github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.source.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.repository == 'thebcd69/bcd-games' && 'main' || github.ref }}
          persist-credentials: false
          sparse-checkout: tools
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Generate source from the latest stable release
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          BCD_SOURCE_REPO: ${{ github.repository }}
        run: python3 tools/update-altsource.py
      - name: Upload Pages files
        if: steps.source.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build-out/altsource

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
